<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFix — My Submitted Reports</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="student-dashboard.html" class="brand">🛠️ CampusFix</a>
        <div class="user-info">
            <span id="user-display">Student</span>
            <a href="student-dashboard.html" style="color: #cbd5e1; text-decoration: none;">Dashboard</a>
            <a href="my-reports.html" style="color: #ffffff; font-weight: bold; text-decoration: none;">My Reports</a>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>My Reported Problems</h2>
            <a href="report-problem.html" class="btn btn-primary">+ Report New Problem</a>
        </div>

        <!-- Search and Filter Bar -->
        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <input type="text" id="search-input" placeholder="Search by title or location..." style="flex: 2; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px;">
                
                <select id="filter-status" style="flex: 1; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <option value="ALL">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="RESOLVED">Resolved</option>
                    <option value="REJECTED">Rejected</option>
                </select>

                <select id="filter-priority" style="flex: 1; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <option value="ALL">All Priorities</option>
                    <option value="CRITICAL">Critical</option>
                    <option value="HIGH">High</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="LOW">Low</option>
                </select>
            </div>
        </div>

        <!-- Table Container -->
        <div class="card">
            <div id="reports-table-container">
                <p style="color: #64748b;">Loading reports list...</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/student.js"></script>
</body>
</html>
